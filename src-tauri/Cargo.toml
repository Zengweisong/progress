[package]
name = "shixu"
version = "0.1.0"
description = "拾序 · 项目与个人知识工作台"
authors = ["Shixu"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
